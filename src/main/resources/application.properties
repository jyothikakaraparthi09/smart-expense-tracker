spring.application.name=smart-expense-tracker

spring.datasource.url=jdbc:postgresql://localhost:5432/expense_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.com.jyothi.smartexpensetracker.service = trace
logging.level.com.jyothi.smartexpensetracker.controller = trace
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

app.base-url=http://localhost:8080/smart-expense-tracker

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}