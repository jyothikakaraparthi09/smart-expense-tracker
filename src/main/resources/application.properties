spring.application.name=smart-expense-tracker

spring.datasource.url=${SPRING_DATASOURCE_USERNAME:jdbc:postgresql://localhost:5432/expense_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.com.jyothi.smartexpensetracker.service = INFO
logging.level.com.jyothi.smartexpensetracker.controller = INFO
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

app.base-url=${SPRING_API_URL:http://localhost:8080/smart-expense-tracker}

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}